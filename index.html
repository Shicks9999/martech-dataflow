<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slack Marketing: Customer Communication Platforms — Data Flow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #4ecdc4, #6c63ff, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        header p {
            color: #8892b0;
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .controls button {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #ccd6f6;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .controls button:hover, .controls button.active {
            background: rgba(108, 99, 255, 0.2);
            border-color: #6c63ff;
            color: #fff;
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.2);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 16px 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #8892b0;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* Category sections */
        .category-section {
            max-width: 1500px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .category-header h2 {
            font-size: 1.3rem;
            color: #fff;
        }

        .category-header .cat-icon {
            font-size: 1.5rem;
        }

        .category-header .platform-count {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #8892b0;
        }

        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .node {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .node::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--node-color);
            opacity: 0.6;
        }

        .node:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: var(--node-color);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3), 0 0 25px color-mix(in srgb, var(--node-color) 15%, transparent);
        }

        .node.highlighted {
            border-color: var(--node-color);
            background: color-mix(in srgb, var(--node-color) 8%, rgba(255,255,255,0.03));
            box-shadow: 0 0 30px color-mix(in srgb, var(--node-color) 20%, transparent);
        }

        .node.dimmed {
            opacity: 0.2;
            transform: scale(0.97);
        }

        .node-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #fff;
        }

        .node-desc {
            font-size: 0.73rem;
            color: #8892b0;
            line-height: 1.4;
        }

        .node-badges {
            margin-top: 10px;
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .node-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 500;
            background: color-mix(in srgb, var(--node-color) 12%, transparent);
            color: var(--node-color);
            border: 1px solid color-mix(in srgb, var(--node-color) 25%, transparent);
        }

        .node-badge.warning {
            background: rgba(255, 165, 0, 0.1);
            color: #ffa500;
            border-color: rgba(255, 165, 0, 0.3);
        }

        .node-badge.new {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border-color: rgba(0, 255, 136, 0.3);
        }

        /* Category colors */
        .node[data-category="data"] { --node-color: #4ecdc4; }
        .node[data-category="analytics"] { --node-color: #ffd93d; }
        .node[data-category="decisioning"] { --node-color: #6c63ff; }
        .node[data-category="presentation"] { --node-color: #ff6b6b; }
        .node[data-category="channels"] { --node-color: #ff9ff3; }

        /* Flow visualization overlay */
        .flow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 26, 0.95);
            z-index: 500;
            display: none;
            overflow: auto;
        }

        .flow-overlay.active { display: block; }

        .flow-overlay .close-flow {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 501;
            font-size: 0.9rem;
        }

        .flow-canvas {
            width: 100%;
            min-height: 100vh;
            padding: 80px 40px 40px;
        }

        .flow-diagram {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .flow-layer {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            background: rgba(255,255,255,0.02);
            width: 100%;
            position: relative;
        }

        .flow-layer::before {
            content: attr(data-label);
            position: absolute;
            top: -10px;
            left: 20px;
            background: #0f0f1a;
            padding: 0 10px;
            font-size: 0.75rem;
            color: var(--layer-color, #8892b0);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .flow-node {
            padding: 10px 16px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
            color: #ccd6f6;
            transition: all 0.3s;
        }

        .flow-node:hover {
            background: rgba(108, 99, 255, 0.15);
            border-color: #6c63ff;
        }

        .flow-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #6c63ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Detail panel */
        .detail-panel {
            position: fixed;
            right: -450px;
            top: 0;
            width: 420px;
            height: 100vh;
            background: #16213e;
            border-left: 1px solid rgba(255,255,255,0.08);
            padding: 40px 24px;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            overflow-y: auto;
        }

        .detail-panel.open {
            right: 0;
            box-shadow: -10px 0 40px rgba(0,0,0,0.5);
        }

        .detail-panel .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #8892b0;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .detail-panel h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .detail-panel .category-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-bottom: 16px;
        }

        .detail-panel h3 {
            font-size: 0.8rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 18px 0 8px;
        }

        .detail-panel ul {
            list-style: none;
            padding: 0;
        }

        .detail-panel ul li {
            padding: 7px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 5px;
            font-size: 0.82rem;
            border-left: 3px solid var(--panel-color, #6c63ff);
        }

        .detail-panel .flow-connection {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-panel .flow-connection .dir {
            color: var(--panel-color, #6c63ff);
            font-weight: bold;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 30px 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4ecdc4, #6c63ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #8892b0;
            margin-top: 4px;
        }

        /* Search */
        .search-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 0 20px 10px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #6c63ff;
        }

        .search-input::placeholder {
            color: #5a6380;
        }

        @media (max-width: 768px) {
            .nodes-grid { grid-template-columns: 1fr 1fr; }
            .detail-panel { width: 100%; right: -100%; }
            .stats-bar { gap: 20px; }
        }

        @media (max-width: 480px) {
            .nodes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                items: [
                    { id: 'ch-email', title: 'Email', desc: 'Salesforce Marketing Cloud (SMC)', notes: '', dataFlows: { in: ['Templates from SMC', 'Audiences from Data Cloud', 'Triggers from Agentforce'], out: ['Engagement data to Snowflake', 'Deliverability metrics'] } },
                    { id: 'ch-web', title: 'Web / Digital', desc: 'slack.com, landing pages, PLG flows', notes: '', dataFlows: { in: ['CMS content', 'Personalization from Optimizely', 'Qualified chat'], out: ['Conversion events to GA4', 'Form fills to CRM'] } },
                    { id: 'ch-inapp', title: 'In-App', desc: 'Product-led growth notifications within Slack', notes: '', dataFlows: { in: ['PQL signals from MadKudu', 'Experiment variants'], out: ['Usage events to Snowflake', 'Conversion to MadKudu'] } },
                    { id: 'ch-paid', title: 'Paid Media', desc: 'Google Ads, Meta, LinkedIn, CM360, Capterra, Teads, OMR, Reddit', notes: '', dataFlows: { in: ['Audiences from LiveRamp/Data Cloud', 'ABM lists from Demandbase'], out: ['Impression/click data to MI', 'Conversion events'] } },
                    { id: 'ch-events', title: 'Webinar / Virtual Events', desc: 'ON24, Rainfocus', notes: '', dataFlows: { in: ['Event content', 'Promo from email/paid'], out: ['Registration/attendance to CRM', 'Engagement to Data Cloud'] } },
                    { id: 'ch-affiliate', title: 'Affiliate / Partner', desc: 'Impact', notes: '', dataFlows: { in: ['Partner program config', 'Creative assets'], out: ['Referral conversions to Thrive', 'Commission events'] } }
                ]
            }
        };

        // Cross-platform data flows (connections between categories)
        const crossFlows = [
            { from: 'snowflake', to: 'looker', label: 'Query results' },
            { from: 'snowflake', to: 'tableau', label: 'Dashboard data' },
            { from: 'snowflake', to: 'marketing-intelligence', label: 'Attribution data' },
            { from: 'data-cloud', to: 'smc', label: 'Audience segments' },
            { from: 'data-cloud', to: 'agentforce', label: 'Customer signals' },
            { from: 'data-cloud', to: 'ch-email', label: 'Segment activation' },
            { from: 'salesforce-crm', to: 'data-cloud', label: 'CRM sync' },
            { from: 'salesforce-crm', to: 'next-gen-ma', label: 'Lead data' },
            { from: 'demandbase', to: 'ch-paid', label: 'ABM targeting' },
            { from: 'liveramp', to: 'ch-paid', label: 'Matched audiences' },
            { from: 'on24-data', to: 'snowflake', label: 'Event data' },
            { from: 'leadspace', to: 'data-cloud', label: 'Enriched profiles' },
            { from: 'clearbit', to: 'salesforce-crm', label: 'Lead enrichment' },
            { from: 'madkudu', to: 'salesforce-crm', label: 'PQL scores' },
            { from: 'madkudu', to: 'agentforce', label: 'Lead signals' },
            { from: 'agentforce', to: 'smc', label: 'Campaign triggers' },
            { from: 'agentforce', to: 'ch-email', label: 'Automated sends' },
            { from: 'optimizely', to: 'slack-web', label: 'Experiments' },
            { from: 'optimizely', to: 'ga4', label: 'Experiment data' },
            { from: 'ga4', to: 'snowflake', label: 'Web analytics' },
            { from: 'impact', to: 'thrive', label: 'Partner events' },
            { from: 'smc', to: 'snowflake', label: 'Email metrics' },
            { from: 'smc', to: 'ch-email', label: 'Email delivery' },
            { from: 'wordpress', to: 'slack-web', label: 'Content publish' },
            { from: 'schema-app', to: 'slack-web', label: 'Schema markup' },
            { from: 'qualified', to: 'salesforce-crm', label: 'MQL / meetings' },
            { from: 'integrate', to: 'salesforce-crm', label: 'Qualified leads' },
            { from: 'profound', to: 'wordpress', label: 'SEO decisions' },
            { from: 'content-square', to: 'slack-web', label: 'UX insights' },
            { from: 'marketing-intelligence', to: 'tableau', label: 'Attribution' }
        ];

        // Build all nodes flat list
        const allNodes = [];
        Object.entries(platforms).forEach(([cat, data]) => {
            data.items.forEach(item => {
                allNodes.push({ ...item, category: cat });
            });
        });

        // Render category sections
        const container = document.getElementById('sections-container');
        Object.entries(platforms).forEach(([catKey, catData]) => {
            const section = document.createElement('div');
            section.className = 'category-section';
            section.dataset.category = catKey;

            section.innerHTML = `
                <div class="category-header">
                    <span class="cat-icon">${catData.icon}</span>
                    <h2>${catData.label}</h2>
                    <span class="platform-count">${catData.items.length} platforms</span>
                </div>
                <div class="nodes-grid" id="grid-${catKey}"></div>
            `;
            container.appendChild(section);

            const grid = section.querySelector('.nodes-grid');
            catData.items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'node';
                el.dataset.id = item.id;
                el.dataset.category = catKey;
                el.style.setProperty('--node-color', catData.color);

                let badges = '';
                if (item.notes.includes('New to Slack')) badges += `<span class="node-badge new">New</span>`;
                if (item.notes.includes('retiring') || item.notes.includes('moving to')) badges += `<span class="node-badge warning">Changing</span>`;
                if (item.notes.includes('shared platform')) badges += `<span class="node-badge">Shared</span>`;
                if (item.notes.includes('Independent')) badges += `<span class="node-badge">Independent</span>`;
                if (item.notes.includes('Same platform')) badges += `<span class="node-badge">Multi-instance</span>`;

                el.innerHTML = `
                    <div class="node-title">${item.title}</div>
                    <div class="node-desc">${item.desc}</div>
                    <div class="node-badges">${badges}</div>
                `;
                el.addEventListener('click', () => showDetail(item, catKey, catData.color));
                el.addEventListener('mouseenter', () => highlightConnections(item.id));
                el.addEventListener('mouseleave', clearHighlights);
                grid.appendChild(el);
            });
        });

        // Highlight connections
        function highlightConnections(nodeId) {
            const connectedIds = new Set([nodeId]);
            crossFlows.forEach(f => {
                if (f.from === nodeId) connectedIds.add(f.to);
                if (f.to === nodeId) connectedIds.add(f.from);
            });

            document.querySelectorAll('.node').forEach(n => {
                if (connectedIds.has(n.dataset.id)) {
                    n.classList.add('highlighted');
                    n.classList.remove('dimmed');
                } else {
                    n.classList.add('dimmed');
                    n.classList.remove('highlighted');
                }
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.node').forEach(n => {
                n.classList.remove('highlighted', 'dimmed');
            });
        }

        // Detail panel
        function showDetail(item, catKey, color) {
            const panel = document.getElementById('detail-panel');
            const content = document.getElementById('panel-content');
            content.style.setProperty('--panel-color', color);

            const relatedFlows = crossFlows.filter(f => f.from === item.id || f.to === item.id);

            content.innerHTML = `
                <h2>${item.title}</h2>
                <span class="category-tag" style="background:${color}22; color:${color}; border:1px solid ${color}44;">${platforms[catKey].label}</span>
                ${item.notes ? `<div style="margin-bottom:12px;"><span class="node-badge ${item.notes.includes('New') ? 'new' : item.notes.includes('retiring') || item.notes.includes('moving') ? 'warning' : ''}" style="font-size:0.75rem;">${item.notes}</span></div>` : ''}
                <p style="color:#8892b0; font-size:0.9rem; line-height:1.5;">${item.desc}</p>

                <h3>Data Inputs</h3>
                <ul>${item.dataFlows.in.map(d => `<li><div class="flow-connection"><span class="dir">&rarr;</span> ${d}</div></li>`).join('')}</ul>

                <h3>Data Outputs</h3>
                <ul>${item.dataFlows.out.map(d => `<li><div class="flow-connection"><span class="dir">&larr;</span> ${d}</div></li>`).join('')}</ul>

                ${relatedFlows.length ? `
                    <h3>Cross-Platform Flows</h3>
                    <ul>${relatedFlows.map(f => {
                        const isFrom = f.from === item.id;
                        const otherId = isFrom ? f.to : f.from;
                        const otherNode = allNodes.find(n => n.id === otherId);
                        return `<li><div class="flow-connection"><span class="dir">${isFrom ? '&rarr;' : '&larr;'}</span> ${otherNode ? otherNode.title : otherId}: ${f.label}</div></li>`;
                    }).join('')}</ul>
                ` : ''}
            `;
            panel.classList.add('open');
        }

        document.getElementById('close-panel').addEventListener('click', () => {
            document.getElementById('detail-panel').classList.remove('open');
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.getElementById('detail-panel').classList.remove('open');
                document.getElementById('flow-overlay').classList.remove('active');
            }
        });

        // Filter
        document.querySelectorAll('.controls button[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.controls button[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                document.querySelectorAll('.category-section').forEach(sec => {
                    sec.style.display = (filter === 'all' || sec.dataset.category === filter) ? '' : 'none';
                });
            });
        });

        // Search
        document.getElementById('search').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            document.querySelectorAll('.node').forEach(node => {
                const title = node.querySelector('.node-title').textContent.toLowerCase();
                const desc = node.querySelector('.node-desc').textContent.toLowerCase();
                node.style.display = (!q || title.includes(q) || desc.includes(q)) ? '' : 'none';
            });
            // Show all sections during search
            if (q) {
                document.querySelectorAll('.category-section').forEach(s => s.style.display = '');
            }
        });

        // Flow diagram overlay
        document.getElementById('flow-btn').addEventListener('click', () => {
            document.getElementById('flow-overlay').classList.add('active');
            renderFlowDiagram();
        });

        document.getElementById('close-flow').addEventListener('click', () => {
            document.getElementById('flow-overlay').classList.remove('active');
        });

        function renderFlowDiagram() {
            const diagram = document.getElementById('flow-diagram');
            const layers = [
                { key: 'data', label: 'DATA LAYER', color: '#4ecdc4' },
                { key: 'decisioning', label: 'DECISIONING LAYER', color: '#6c63ff' },
                { key: 'presentation', label: 'PRESENTATION LAYER', color: '#ff6b6b' },
                { key: 'channels', label: 'CHANNEL LAYER', color: '#ff9ff3' },
                { key: 'analytics', label: 'ANALYTICS LAYER', color: '#ffd93d' }
            ];

            diagram.innerHTML = layers.map((layer, i) => `
                ${i > 0 ? '<div class="flow-arrow">&#x2193; &#x2193; &#x2193;</div>' : ''}
                <div class="flow-layer" data-label="${layer.label}" style="--layer-color:${layer.color}; border-color:${layer.color}33;">
                    ${platforms[layer.key].items.map(item => `
                        <div class="flow-node" style="border-color:${layer.color}44;">${item.title}</div>
                    `).join('')}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
