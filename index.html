<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slack Marketing: Customer Communication Platforms — Data Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --slack-aubergine: #611f69;
            --slack-aubergine-dark: #4a154b;
            --slack-aubergine-light: #7c3085;
            --slack-blue: #36c5f0;
            --slack-green: #2eb67d;
            --slack-yellow: #ecb22e;
            --slack-red: #e01e5a;
            --slack-dark: #1d1c1d;
            --slack-cream: #f4ede4;
            --slack-white: #ffffff;
            --slack-gray-100: #f8f8f8;
            --slack-gray-200: #ebeaeb;
            --slack-gray-300: #dddcdd;
            --slack-gray-500: #8d8d8e;
            --slack-gray-700: #616061;
            --slack-gray-900: #1d1c1d;
            --radius: 12px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(29,28,29,0.08);
            --shadow-md: 0 4px 12px rgba(29,28,29,0.1);
            --shadow-lg: 0 12px 40px rgba(29,28,29,0.12);
        }

        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--slack-white);
            color: var(--slack-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: var(--slack-aubergine-dark);
            padding: 48px 24px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(54, 197, 240, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 50%, rgba(46, 182, 125, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .slack-mark {
            display: flex;
            align-items: center;
            gap: 3px;
            transform: rotate(-2deg);
        }

        .slack-mark .dot {
            width: 8px;
            height: 8px;
            border-radius: 3px;
        }

        .slack-mark .dot:nth-child(1) { background: var(--slack-blue); }
        .slack-mark .dot:nth-child(2) { background: var(--slack-green); }
        .slack-mark .dot:nth-child(3) { background: var(--slack-yellow); }
        .slack-mark .dot:nth-child(4) { background: var(--slack-red); }

        header h1 {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--slack-white);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            position: relative;
        }

        header p {
            color: rgba(255,255,255,0.75);
            font-size: 1.05rem;
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px 20px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            background: var(--slack-white);
            z-index: 100;
            border-bottom: 1px solid var(--slack-gray-200);
            box-shadow: var(--shadow-sm);
        }

        .controls button {
            padding: 8px 18px;
            border: 1px solid var(--slack-gray-300);
            border-radius: 100px;
            background: var(--slack-white);
            color: var(--slack-gray-700);
            font-size: 0.85rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .controls button:hover {
            background: var(--slack-gray-100);
            border-color: var(--slack-gray-500);
            color: var(--slack-dark);
        }

        .controls button.active {
            background: var(--slack-aubergine-dark);
            border-color: var(--slack-aubergine-dark);
            color: var(--slack-white);
        }

        .controls button#flow-btn {
            background: var(--slack-green);
            border-color: var(--slack-green);
            color: var(--slack-white);
        }

        .controls button#flow-btn:hover {
            background: #26a06b;
            border-color: #26a06b;
        }

        /* Search */
        .search-container {
            max-width: 420px;
            margin: 0 auto;
            padding: 16px 20px 8px;
        }

        .search-input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 100px;
            border: 1px solid var(--slack-gray-300);
            background: var(--slack-gray-100);
            color: var(--slack-dark);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--slack-aubergine);
            background: var(--slack-white);
            box-shadow: 0 0 0 3px rgba(97, 31, 105, 0.1);
        }

        .search-input::placeholder {
            color: var(--slack-gray-500);
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 14px 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--slack-gray-200);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--slack-gray-700);
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        /* Category sections */
        .category-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px 20px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--slack-gray-200);
        }

        .category-header h2 {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--slack-dark);
            letter-spacing: -0.3px;
        }

        .category-header .cat-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .category-header .platform-count {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 100px;
            background: var(--slack-gray-100);
            color: var(--slack-gray-700);
        }

        /* Nodes grid */
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
        }

        .node {
            background: var(--slack-white);
            border: 1px solid var(--slack-gray-200);
            border-radius: var(--radius);
            padding: 20px 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .node::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--node-color);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .node:hover {
            border-color: var(--node-color);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .node:hover::before {
            opacity: 1;
        }

        .node.highlighted {
            border-color: var(--node-color);
            background: color-mix(in srgb, var(--node-color) 4%, var(--slack-white));
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--node-color) 12%, transparent), var(--shadow-md);
        }

        .node.highlighted::before {
            opacity: 1;
        }

        .node.dimmed {
            opacity: 0.3;
            transform: scale(0.98);
        }

        .node-title {
            font-weight: 900;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--slack-dark);
        }

        .node-desc {
            font-size: 0.78rem;
            color: var(--slack-gray-700);
            line-height: 1.5;
        }

        .node-badges {
            margin-top: 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .node-badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .node-badge.status-default {
            background: var(--slack-gray-100);
            color: var(--slack-gray-700);
        }

        .node-badge.status-new {
            background: rgba(46, 182, 125, 0.1);
            color: #1a8a5c;
        }

        .node-badge.status-warning {
            background: rgba(236, 178, 46, 0.12);
            color: #9a7400;
        }

        .node-badge.status-shared {
            background: rgba(54, 197, 240, 0.1);
            color: #1a7fa8;
        }

        /* Category node colors */
        .node[data-category="data"] { --node-color: var(--slack-blue); }
        .node[data-category="analytics"] { --node-color: var(--slack-yellow); }
        .node[data-category="decisioning"] { --node-color: var(--slack-aubergine); }
        .node[data-category="presentation"] { --node-color: var(--slack-red); }
        .node[data-category="channels"] { --node-color: var(--slack-green); }

        /* Flow overlay */
        .flow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--slack-cream);
            z-index: 500;
            display: none;
            overflow: auto;
        }

        .flow-overlay.active { display: block; }

        .flow-overlay .close-flow {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--slack-aubergine-dark);
            border: none;
            color: var(--slack-white);
            padding: 10px 20px;
            border-radius: 100px;
            cursor: pointer;
            z-index: 501;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: inherit;
            box-shadow: var(--shadow-md);
        }

        .flow-overlay .close-flow:hover {
            background: var(--slack-aubergine);
        }

        .flow-canvas {
            width: 100%;
            min-height: 100vh;
            padding: 80px 40px 40px;
        }

        .flow-diagram {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .flow-layer {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 24px 20px;
            border: 2px solid var(--layer-color);
            border-radius: var(--radius-lg);
            background: var(--slack-white);
            width: 100%;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .flow-layer::before {
            content: attr(data-label);
            position: absolute;
            top: -11px;
            left: 24px;
            background: var(--slack-white);
            padding: 0 12px;
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--layer-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .flow-node {
            padding: 8px 14px;
            border-radius: 100px;
            background: var(--slack-gray-100);
            border: 1px solid var(--slack-gray-200);
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--slack-dark);
            transition: all 0.2s;
        }

        .flow-node:hover {
            background: color-mix(in srgb, var(--layer-color) 10%, var(--slack-white));
            border-color: var(--layer-color);
        }

        .flow-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 4px 0;
        }

        .flow-arrow-line {
            width: 2px;
            height: 20px;
            background: var(--slack-gray-300);
            border-radius: 2px;
        }

        .flow-arrow svg {
            width: 20px;
            height: 20px;
            fill: var(--slack-aubergine);
        }

        /* Detail panel */
        .detail-panel {
            position: fixed;
            right: -460px;
            top: 0;
            width: 440px;
            height: 100vh;
            background: var(--slack-white);
            border-left: 1px solid var(--slack-gray-200);
            padding: 40px 28px;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            overflow-y: auto;
            box-shadow: none;
        }

        .detail-panel.open {
            right: 0;
            box-shadow: -8px 0 30px rgba(29,28,29,0.12);
        }

        .detail-panel .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--slack-gray-100);
            border: none;
            color: var(--slack-gray-700);
            font-size: 1.2rem;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .detail-panel .close-btn:hover {
            background: var(--slack-gray-200);
        }

        .detail-panel h2 {
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 8px;
            color: var(--slack-dark);
        }

        .detail-panel .category-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .detail-panel .notes-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 14px;
            margin-left: 6px;
        }

        .detail-panel p {
            color: var(--slack-gray-700);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .detail-panel h3 {
            font-size: 0.72rem;
            font-weight: 900;
            color: var(--slack-gray-500);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin: 22px 0 10px;
        }

        .detail-panel ul {
            list-style: none;
            padding: 0;
        }

        .detail-panel ul li {
            padding: 9px 14px;
            background: var(--slack-gray-100);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.82rem;
            font-weight: 400;
            color: var(--slack-dark);
            border-left: 3px solid var(--panel-color, var(--slack-aubergine));
        }

        .detail-panel .flow-connection {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-panel .flow-connection .dir {
            color: var(--panel-color, var(--slack-aubergine));
            font-weight: 900;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 48px;
            padding: 40px 20px;
            background: var(--slack-aubergine-dark);
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--slack-white);
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Footer */
        .footer {
            background: var(--slack-dark);
            padding: 24px;
            text-align: center;
            color: var(--slack-gray-500);
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .nodes-grid { grid-template-columns: 1fr 1fr; }
            .detail-panel { width: 100%; right: -100%; }
            .stats-bar { gap: 24px; padding: 30px 20px; }
            header h1 { font-size: 1.8rem; }
        }

        @media (max-width: 480px) {
            .nodes-grid { grid-template-columns: 1fr; }
            .controls { gap: 6px; }
            .controls button { padding: 6px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-logo">
            <div class="slack-mark">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <h1>Customer Communication Platforms</h1>
        <p>Interactive data flow map of Slack Marketing's martech ecosystem</p>
    </header>

    <div class="controls">
        <button class="active" data-filter="all">All (43)</button>
        <button data-filter="data">Data (10)</button>
        <button data-filter="analytics">Analytics (12)</button>
        <button data-filter="decisioning">Decisioning (8)</button>
        <button data-filter="presentation">Presentation (7)</button>
        <button data-filter="channels">Channels (6)</button>
        <button id="flow-btn">View Flow Diagram</button>
    </div>

    <div class="search-container">
        <input type="text" class="search-input" id="search" placeholder="Search platforms...">
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--slack-blue)"></div>Data</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--slack-yellow)"></div>Analytics</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--slack-aubergine)"></div>Decisioning</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--slack-red)"></div>Presentation</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--slack-green)"></div>Channels</div>
    </div>

    <div id="sections-container"></div>

    <div class="stats-bar">
        <div class="stat"><div class="stat-value">43</div><div class="stat-label">Total Platforms</div></div>
        <div class="stat"><div class="stat-value">5</div><div class="stat-label">Functional Layers</div></div>
        <div class="stat"><div class="stat-value">6</div><div class="stat-label">Channels</div></div>
        <div class="stat"><div class="stat-value">4</div><div class="stat-label">New to Slack</div></div>
        <div class="stat"><div class="stat-value">3</div><div class="stat-label">Core Changes</div></div>
    </div>

    <div class="footer">
        Slack Marketing &middot; Customer Communication Platforms &middot; Internal Use Only
    </div>

    <div class="detail-panel" id="detail-panel">
        <button class="close-btn" id="close-panel">&times;</button>
        <div id="panel-content"></div>
    </div>

    <div class="flow-overlay" id="flow-overlay">
        <button class="close-flow" id="close-flow">Close Flow View</button>
        <div class="flow-canvas">
            <div class="flow-diagram" id="flow-diagram"></div>
        </div>
    </div>

    <script>
        const platforms = {
            data: {
                label: 'Data',
                icon: '🗄️',
                color: 'var(--slack-blue)',
                colorHex: '#36c5f0',
                items: [
                    { id: 'snowflake', title: 'Snowflake', desc: 'Primary data warehouse; source for campaign, enrichment, and attribution data', notes: '', dataFlows: { in: ['Campaign events', 'Enrichment sources', 'Attribution signals'], out: ['Query results to Looker/Tableau', 'Audience segments to Data Cloud', 'Attribution data to MI'] } },
                    { id: 'data-cloud', title: 'Salesforce Data Cloud', desc: 'Unified customer profiles and data activation; Slack Individual dataset migration in progress', notes: 'Core moving to Data360', dataFlows: { in: ['CRM data from Org62', 'Enrichment from Leadspace/Clearbit', 'Behavioral events'], out: ['Unified profiles to SMC', 'Segments to channels', 'Activation signals to Agentforce'] } },
                    { id: 'salesforce-crm', title: 'Salesforce CRM (Org62)', desc: 'Lead, contact, and opportunity data', notes: '', dataFlows: { in: ['Lead forms', 'Sales activity', 'MadKudu PQL scores'], out: ['Contact data to Data Cloud', 'Opportunity data to Snowflake', 'Lead info to Demandbase'] } },
                    { id: 'demandbase', title: 'Demandbase', desc: 'SMB lead enrichment and ABM targeting', notes: 'Core moving to Data360', dataFlows: { in: ['Account lists from CRM', 'Intent signals', 'Web visitor data'], out: ['ABM targeting to paid media', 'Lead enrichment to CRM', 'Account scores'] } },
                    { id: 'liveramp', title: 'LiveRamp', desc: 'Data clean room / LinkedIn data matching', notes: '', dataFlows: { in: ['First-party audiences from Data Cloud', 'CRM segments'], out: ['Matched audiences to LinkedIn', 'Clean room insights'] } },
                    { id: 'on24-data', title: 'ON24', desc: 'Webinar event data ingestion', notes: '', dataFlows: { in: ['Webinar registrations', 'Attendance data', 'Engagement scores'], out: ['Event data to Snowflake', 'Attendee lists to CRM', 'Engagement to Data Cloud'] } },
                    { id: 'crunchbase', title: 'Crunchbase', desc: 'Company/firmographic enrichment data', notes: '', dataFlows: { in: ['Company lookups from CRM'], out: ['Firmographic data to Data Cloud', 'Company info enrichment'] } },
                    { id: 'leadspace', title: 'Leadspace', desc: 'B2B data enrichment and audience building', notes: '', dataFlows: { in: ['Lead/contact records', 'Account data'], out: ['Enriched profiles to Data Cloud', 'Audience segments'] } },
                    { id: 'clearbit', title: 'Clearbit', desc: 'Lead enrichment — independent tool', notes: 'Independent tool', dataFlows: { in: ['Email/domain lookups'], out: ['Company & person data to CRM', 'Enrichment to Data Cloud'] } },
                    { id: 'clay', title: 'Clay', desc: 'Data enrichment and outbound automation', notes: 'Same platform, different instance', dataFlows: { in: ['Lead lists', 'Enrichment triggers'], out: ['Enriched data to CRM', 'Outbound sequences'] } }
                ]
            },
            analytics: {
                label: 'Analytics',
                icon: '📊',
                color: 'var(--slack-yellow)',
                colorHex: '#ecb22e',
                items: [
                    { id: 'looker', title: 'Looker', desc: 'Governed marketing KPIs and metric definitions', notes: '', dataFlows: { in: ['Snowflake query results', 'Metric definitions'], out: ['Dashboards to stakeholders', 'KPI alerts'] } },
                    { id: 'tableau', title: 'Tableau / Tableau Next', desc: 'Marketing dashboards; bundled with Marketing Intelligence', notes: '', dataFlows: { in: ['Snowflake data', 'MI attribution data'], out: ['Visual dashboards', 'Embedded analytics'] } },
                    { id: 'ga4', title: 'Google Analytics 4 (GA4)', desc: 'Web analytics for slack.com; BigQuery dataset integration', notes: 'Same platform, different instance', dataFlows: { in: ['slack.com page events', 'Conversion tags'], out: ['Web behavior to BigQuery/Snowflake', 'Audience signals to Google Ads'] } },
                    { id: 'marketing-intelligence', title: 'Marketing Intelligence (MI)', desc: 'Paid media attribution; 100+ ad/MarTech connectors', notes: '', dataFlows: { in: ['Ad platform spend data', 'Conversion data', 'CRM pipeline'], out: ['Attribution reports to Tableau', 'ROI metrics to Looker'] } },
                    { id: 'haus', title: 'Haus', desc: 'Incrementality measurement / experimentation', notes: '', dataFlows: { in: ['Campaign exposure data', 'Conversion events'], out: ['Incrementality reports', 'Experiment results'] } },
                    { id: 'thrive', title: 'Thrive', desc: 'Growth/affiliate analytics pipeline', notes: '', dataFlows: { in: ['Affiliate events from Impact', 'Growth signals'], out: ['Pipeline analytics to Snowflake', 'Partner performance'] } },
                    { id: 'semrush', title: 'SEMrush', desc: 'SEO analytics and competitive research', notes: 'Core & Slack shared platform', dataFlows: { in: ['Keyword tracking', 'Competitor URLs'], out: ['SEO insights', 'Competitive intelligence'] } },
                    { id: 'brightedge', title: 'BrightEdge', desc: 'Enterprise SEO and content performance', notes: '⚠️ Core retiring contract', dataFlows: { in: ['Page rankings', 'Content URLs'], out: ['SEO recommendations', 'Content performance'] } },
                    { id: 'schema-app', title: 'Schema App', desc: 'Structured data / schema markup for SEO', notes: 'Independent tool', dataFlows: { in: ['Page templates', 'Content metadata'], out: ['Schema markup to slack.com', 'Rich result eligibility'] } },
                    { id: 'ahrefs', title: 'Ahrefs', desc: 'SEO tool — new to Slack', notes: 'New to Slack', dataFlows: { in: ['Domain/URL inputs', 'Competitor analysis'], out: ['Backlink data', 'Keyword opportunities'] } },
                    { id: 'lumar', title: 'Lumar', desc: 'Website intelligence / technical SEO', notes: 'Independent tool — New to Slack', dataFlows: { in: ['Crawl of slack.com', 'Technical config'], out: ['Technical SEO issues', 'Site health reports'] } },
                    { id: 'speedcurve', title: 'SpeedCurve', desc: 'Web performance monitoring', notes: 'Same platform, different instance', dataFlows: { in: ['Real user metrics', 'Synthetic tests'], out: ['Performance alerts', 'Core Web Vitals'] } }
                ]
            },
            decisioning: {
                label: 'Decisioning',
                icon: '🧠',
                color: 'var(--slack-aubergine)',
                colorHex: '#611f69',
                items: [
                    { id: 'madkudu', title: 'MadKudu (PQL)', desc: 'Product Qualified Lead scoring and decisioning', notes: 'New to Slack — PQL Scoring', dataFlows: { in: ['Product usage events', 'CRM data'], out: ['PQL scores to CRM', 'Lead routing signals to Agentforce'] } },
                    { id: 'optimizely', title: 'Optimizely', desc: 'Web experimentation and PLG experimentation', notes: 'Same platform, different instance', dataFlows: { in: ['Experiment configs', 'User segments'], out: ['Winner decisions to slack.com', 'Experiment data to GA4'] } },
                    { id: 'content-square', title: 'Content Square', desc: 'Digital experience analytics and optimization', notes: 'Same platform, different instance', dataFlows: { in: ['Session replays', 'Click/scroll data'], out: ['UX insights', 'Optimization recommendations'] } },
                    { id: 'agentforce', title: 'Agentforce / AI Agents', desc: 'Decisioning and automation layer across campaigns and lead routing', notes: '', dataFlows: { in: ['PQL scores from MadKudu', 'CRM triggers', 'Data Cloud signals'], out: ['Automated actions to SMC', 'Lead routing to sales', 'Campaign triggers'] } },
                    { id: 'impact', title: 'Impact', desc: 'Partner/affiliate program management and decisioning', notes: '', dataFlows: { in: ['Partner activity', 'Conversion events'], out: ['Commission data to Thrive', 'Partner performance'] } },
                    { id: 'qualified', title: 'Qualified', desc: 'Form to meeting booker; MQL generation', notes: 'New to Slack — Core & Slack shared', dataFlows: { in: ['Web visitor data', 'CRM account info'], out: ['Meeting bookings to CRM', 'MQL signals'] } },
                    { id: 'integrate', title: 'Integrate', desc: 'Demand gen / lead management and routing', notes: 'Independent tool; Core moving to Converter', dataFlows: { in: ['Content syndication leads', 'Third-party leads'], out: ['Qualified leads to CRM', 'Routing decisions'] } },
                    { id: 'profound', title: 'Profound', desc: 'SEO decisioning tool', notes: 'New to Slack — Core & Slack shared', dataFlows: { in: ['SEO data from Ahrefs/SEMrush', 'Content inventory'], out: ['Content optimization decisions', 'Priority recommendations'] } }
                ]
            },
            presentation: {
                label: 'Presentation',
                icon: '🎨',
                color: 'var(--slack-red)',
                colorHex: '#e01e5a',
                items: [
                    { id: 'smc', title: 'Salesforce Marketing Cloud (SMC)', desc: 'Core email execution engine and data extensions', notes: 'Core & Slack shared platform', dataFlows: { in: ['Segments from Data Cloud', 'Campaign triggers from Agentforce', 'Templates'], out: ['Email sends', 'Engagement data to Snowflake', 'Delivery metrics'] } },
                    { id: 'slack-web', title: 'slack.com (Web)', desc: 'Customer-facing web presence; GA4 + Optimizely for personalization', notes: '', dataFlows: { in: ['CMS content from WordPress', 'Experiments from Optimizely', 'Schema from Schema App'], out: ['Page events to GA4', 'Form fills to CRM', 'Conversion events'] } },
                    { id: 'rainfocus', title: 'Rainfocus', desc: 'Event management and staffing platform', notes: '', dataFlows: { in: ['Event configs', 'Speaker/session data'], out: ['Registration data to CRM', 'Attendance to Snowflake'] } },
                    { id: 'on24-present', title: 'ON24', desc: 'Webinar/virtual event presentation platform', notes: 'Core & Slack shared platform', dataFlows: { in: ['Webinar content', 'Registration lists'], out: ['Engagement scores to Data Cloud', 'Recordings', 'Attendee data'] } },
                    { id: 'yext', title: 'Yext', desc: 'Business listings and knowledge management', notes: 'Core & Slack shared platform', dataFlows: { in: ['Business info updates', 'Location data'], out: ['Listing sync to directories', 'Search analytics'] } },
                    { id: 'wordpress', title: 'WordPress', desc: 'CMS for web content publishing', notes: 'Same platform, different instance', dataFlows: { in: ['Content from marketing team', 'SEO metadata'], out: ['Published pages to slack.com', 'Content feeds'] } },
                    { id: 'next-gen-ma', title: 'Next Gen Marketing Automation', desc: 'Marketing automation platform (Marketo replacement)', notes: 'Core & Slack shared platform', dataFlows: { in: ['Lead data from CRM', 'Behavioral triggers', 'Content assets'], out: ['Nurture emails', 'Lead scores to CRM', 'Campaign analytics'] } }
                ]
            },
            channels: {
                label: 'Channels',
                icon: '📢',
                color: 'var(--slack-green)',
                colorHex: '#2eb67d',
                items: [
                    { id: 'ch-email', title: 'Email', desc: 'Salesforce Marketing Cloud (SMC)', notes: '', dataFlows: { in: ['Templates from SMC', 'Audiences from Data Cloud', 'Triggers from Agentforce'], out: ['Engagement data to Snowflake', 'Deliverability metrics'] } },
                    { id: 'ch-web', title: 'Web / Digital', desc: 'slack.com, landing pages, PLG flows', notes: '', dataFlows: { in: ['CMS content', 'Personalization from Optimizely', 'Qualified chat'], out: ['Conversion events to GA4', 'Form fills to CRM'] } },
                    { id: 'ch-inapp', title: 'In-App', desc: 'Product-led growth notifications within Slack', notes: '', dataFlows: { in: ['PQL signals from MadKudu', 'Experiment variants'], out: ['Usage events to Snowflake', 'Conversion to MadKudu'] } },
                    { id: 'ch-paid', title: 'Paid Media', desc: 'Google Ads, Meta, LinkedIn, CM360, Capterra, Teads, OMR, Reddit', notes: '', dataFlows: { in: ['Audiences from LiveRamp/Data Cloud', 'ABM lists from Demandbase'], out: ['Impression/click data to MI', 'Conversion events'] } },
                    { id: 'ch-events', title: 'Webinar / Virtual Events', desc: 'ON24, Rainfocus', notes: '', dataFlows: { in: ['Event content', 'Promo from email/paid'], out: ['Registration/attendance to CRM', 'Engagement to Data Cloud'] } },
                    { id: 'ch-affiliate', title: 'Affiliate / Partner', desc: 'Impact', notes: '', dataFlows: { in: ['Partner program config', 'Creative assets'], out: ['Referral conversions to Thrive', 'Commission events'] } }
                ]
            }
        };

        const crossFlows = [
            { from: 'snowflake', to: 'looker', label: 'Query results' },
            { from: 'snowflake', to: 'tableau', label: 'Dashboard data' },
            { from: 'snowflake', to: 'marketing-intelligence', label: 'Attribution data' },
            { from: 'data-cloud', to: 'smc', label: 'Audience segments' },
            { from: 'data-cloud', to: 'agentforce', label: 'Customer signals' },
            { from: 'data-cloud', to: 'ch-email', label: 'Segment activation' },
            { from: 'salesforce-crm', to: 'data-cloud', label: 'CRM sync' },
            { from: 'salesforce-crm', to: 'next-gen-ma', label: 'Lead data' },
            { from: 'demandbase', to: 'ch-paid', label: 'ABM targeting' },
            { from: 'liveramp', to: 'ch-paid', label: 'Matched audiences' },
            { from: 'on24-data', to: 'snowflake', label: 'Event data' },
            { from: 'leadspace', to: 'data-cloud', label: 'Enriched profiles' },
            { from: 'clearbit', to: 'salesforce-crm', label: 'Lead enrichment' },
            { from: 'madkudu', to: 'salesforce-crm', label: 'PQL scores' },
            { from: 'madkudu', to: 'agentforce', label: 'Lead signals' },
            { from: 'agentforce', to: 'smc', label: 'Campaign triggers' },
            { from: 'agentforce', to: 'ch-email', label: 'Automated sends' },
            { from: 'optimizely', to: 'slack-web', label: 'Experiments' },
            { from: 'optimizely', to: 'ga4', label: 'Experiment data' },
            { from: 'ga4', to: 'snowflake', label: 'Web analytics' },
            { from: 'impact', to: 'thrive', label: 'Partner events' },
            { from: 'smc', to: 'snowflake', label: 'Email metrics' },
            { from: 'smc', to: 'ch-email', label: 'Email delivery' },
            { from: 'wordpress', to: 'slack-web', label: 'Content publish' },
            { from: 'schema-app', to: 'slack-web', label: 'Schema markup' },
            { from: 'qualified', to: 'salesforce-crm', label: 'MQL / meetings' },
            { from: 'integrate', to: 'salesforce-crm', label: 'Qualified leads' },
            { from: 'profound', to: 'wordpress', label: 'SEO decisions' },
            { from: 'content-square', to: 'slack-web', label: 'UX insights' },
            { from: 'marketing-intelligence', to: 'tableau', label: 'Attribution' }
        ];

        // Build flat node list
        const allNodes = [];
        Object.entries(platforms).forEach(([cat, data]) => {
            data.items.forEach(item => allNodes.push({ ...item, category: cat }));
        });

        // Render sections
        const container = document.getElementById('sections-container');
        Object.entries(platforms).forEach(([catKey, catData]) => {
            const section = document.createElement('div');
            section.className = 'category-section';
            section.dataset.category = catKey;

            section.innerHTML = `
                <div class="category-header">
                    <span class="cat-icon" style="background:${catData.colorHex}18; color:${catData.colorHex};">${catData.icon}</span>
                    <h2>${catData.label}</h2>
                    <span class="platform-count">${catData.items.length} platforms</span>
                </div>
                <div class="nodes-grid" id="grid-${catKey}"></div>
            `;
            container.appendChild(section);

            const grid = section.querySelector('.nodes-grid');
            catData.items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'node';
                el.dataset.id = item.id;
                el.dataset.category = catKey;

                let badges = '';
                if (item.notes.includes('New to Slack')) badges += `<span class="node-badge status-new">New</span>`;
                if (item.notes.includes('retiring') || item.notes.includes('moving to') || item.notes.includes('moving')) badges += `<span class="node-badge status-warning">Changing</span>`;
                if (item.notes.includes('shared platform') || item.notes.includes('shared')) badges += `<span class="node-badge status-shared">Shared</span>`;
                if (item.notes.includes('Independent')) badges += `<span class="node-badge status-default">Independent</span>`;
                if (item.notes.includes('Same platform')) badges += `<span class="node-badge status-default">Multi-instance</span>`;

                el.innerHTML = `
                    <div class="node-title">${item.title}</div>
                    <div class="node-desc">${item.desc}</div>
                    ${badges ? `<div class="node-badges">${badges}</div>` : ''}
                `;
                el.addEventListener('click', () => showDetail(item, catKey, catData.colorHex));
                el.addEventListener('mouseenter', () => highlightConnections(item.id));
                el.addEventListener('mouseleave', clearHighlights);
                grid.appendChild(el);
            });
        });

        // Highlight
        function highlightConnections(nodeId) {
            const connectedIds = new Set([nodeId]);
            crossFlows.forEach(f => {
                if (f.from === nodeId) connectedIds.add(f.to);
                if (f.to === nodeId) connectedIds.add(f.from);
            });

            document.querySelectorAll('.node').forEach(n => {
                if (connectedIds.has(n.dataset.id)) {
                    n.classList.add('highlighted');
                    n.classList.remove('dimmed');
                } else {
                    n.classList.add('dimmed');
                    n.classList.remove('highlighted');
                }
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.node').forEach(n => n.classList.remove('highlighted', 'dimmed'));
        }

        // Detail panel
        function showDetail(item, catKey, color) {
            const panel = document.getElementById('detail-panel');
            const content = document.getElementById('panel-content');
            content.style.setProperty('--panel-color', color);

            const relatedFlows = crossFlows.filter(f => f.from === item.id || f.to === item.id);

            content.innerHTML = `
                <h2>${item.title}</h2>
                <span class="category-tag" style="background:${color}15; color:${color}; border:1px solid ${color}33;">${platforms[catKey].label}</span>
                ${item.notes ? `<span class="notes-tag" style="background:${item.notes.includes('New') ? '#2eb67d15' : item.notes.includes('retiring') || item.notes.includes('moving') ? '#ecb22e15' : '#f4f4f4'}; color:${item.notes.includes('New') ? '#1a8a5c' : item.notes.includes('retiring') || item.notes.includes('moving') ? '#9a7400' : '#616061'};">${item.notes}</span>` : ''}
                <p>${item.desc}</p>

                <h3>Data Inputs</h3>
                <ul>${item.dataFlows.in.map(d => `<li><div class="flow-connection"><span class="dir">&rarr;</span> ${d}</div></li>`).join('')}</ul>

                <h3>Data Outputs</h3>
                <ul>${item.dataFlows.out.map(d => `<li><div class="flow-connection"><span class="dir">&larr;</span> ${d}</div></li>`).join('')}</ul>

                ${relatedFlows.length ? `
                    <h3>Cross-Platform Flows</h3>
                    <ul>${relatedFlows.map(f => {
                        const isFrom = f.from === item.id;
                        const otherId = isFrom ? f.to : f.from;
                        const otherNode = allNodes.find(n => n.id === otherId);
                        return `<li><div class="flow-connection"><span class="dir">${isFrom ? '&rarr;' : '&larr;'}</span> ${otherNode ? otherNode.title : otherId}: ${f.label}</div></li>`;
                    }).join('')}</ul>
                ` : ''}
            `;
            panel.classList.add('open');
        }

        document.getElementById('close-panel').addEventListener('click', () => {
            document.getElementById('detail-panel').classList.remove('open');
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.getElementById('detail-panel').classList.remove('open');
                document.getElementById('flow-overlay').classList.remove('active');
            }
        });

        // Filter
        document.querySelectorAll('.controls button[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.controls button[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                document.querySelectorAll('.category-section').forEach(sec => {
                    sec.style.display = (filter === 'all' || sec.dataset.category === filter) ? '' : 'none';
                });
            });
        });

        // Search
        document.getElementById('search').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            document.querySelectorAll('.category-section').forEach(s => s.style.display = '');
            document.querySelectorAll('.controls button[data-filter]').forEach(b => b.classList.remove('active'));
            document.querySelector('.controls button[data-filter="all"]').classList.add('active');
            document.querySelectorAll('.node').forEach(node => {
                const title = node.querySelector('.node-title').textContent.toLowerCase();
                const desc = node.querySelector('.node-desc').textContent.toLowerCase();
                node.style.display = (!q || title.includes(q) || desc.includes(q)) ? '' : 'none';
            });
        });

        // Flow diagram
        document.getElementById('flow-btn').addEventListener('click', () => {
            document.getElementById('flow-overlay').classList.add('active');
            renderFlowDiagram();
        });

        document.getElementById('close-flow').addEventListener('click', () => {
            document.getElementById('flow-overlay').classList.remove('active');
        });

        function renderFlowDiagram() {
            const diagram = document.getElementById('flow-diagram');
            const layers = [
                { key: 'data', label: 'DATA LAYER', color: '#36c5f0' },
                { key: 'decisioning', label: 'DECISIONING LAYER', color: '#611f69' },
                { key: 'presentation', label: 'PRESENTATION LAYER', color: '#e01e5a' },
                { key: 'channels', label: 'CHANNEL LAYER', color: '#2eb67d' },
                { key: 'analytics', label: 'ANALYTICS LAYER', color: '#ecb22e' }
            ];

            diagram.innerHTML = layers.map((layer, i) => `
                ${i > 0 ? `<div class="flow-arrow"><svg viewBox="0 0 24 24"><path d="M12 4v16m0 0l-6-6m6 6l6-6" stroke="${layer.color}" stroke-width="2" fill="none" stroke-linecap="round"/></svg><svg viewBox="0 0 24 24"><path d="M12 4v16m0 0l-6-6m6 6l6-6" stroke="${layer.color}" stroke-width="2" fill="none" stroke-linecap="round"/></svg><svg viewBox="0 0 24 24"><path d="M12 4v16m0 0l-6-6m6 6l6-6" stroke="${layer.color}" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>` : ''}
                <div class="flow-layer" data-label="${layer.label}" style="--layer-color:${layer.color}; border-color:${layer.color};">
                    ${platforms[layer.key].items.map(item => `
                        <div class="flow-node">${item.title}</div>
                    `).join('')}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
