<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slack Martech Data Flow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #4ecdc4, #6c63ff, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        header p {
            color: #8892b0;
            font-size: 1rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #ccd6f6;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .controls button:hover, .controls button.active {
            background: rgba(108, 99, 255, 0.2);
            border-color: #6c63ff;
            color: #fff;
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.2);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 700px;
        }

        svg.connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .nodes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: auto auto auto;
            gap: 40px 30px;
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .node {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .node::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--node-color);
            opacity: 0.7;
        }

        .node:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--node-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3), 0 0 30px color-mix(in srgb, var(--node-color) 20%, transparent);
        }

        .node.highlighted {
            border-color: var(--node-color);
            background: color-mix(in srgb, var(--node-color) 8%, rgba(255,255,255,0.03));
            box-shadow: 0 0 40px color-mix(in srgb, var(--node-color) 25%, transparent);
        }

        .node.dimmed {
            opacity: 0.25;
            transform: scale(0.97);
        }

        .node-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: block;
        }

        .node-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 6px;
            color: #fff;
        }

        .node-desc {
            font-size: 0.78rem;
            color: #8892b0;
            line-height: 1.4;
        }

        .node-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
            background: color-mix(in srgb, var(--node-color) 15%, transparent);
            color: var(--node-color);
            border: 1px solid color-mix(in srgb, var(--node-color) 30%, transparent);
        }

        /* Flow categories */
        .node[data-category="source"] { --node-color: #4ecdc4; }
        .node[data-category="orchestration"] { --node-color: #6c63ff; }
        .node[data-category="channel"] { --node-color: #ff6b6b; }
        .node[data-category="analytics"] { --node-color: #ffd93d; }

        /* Detail panel */
        .detail-panel {
            position: fixed;
            right: -420px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: #16213e;
            border-left: 1px solid rgba(255,255,255,0.08);
            padding: 40px 30px;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            overflow-y: auto;
        }

        .detail-panel.open {
            right: 0;
            box-shadow: -10px 0 40px rgba(0,0,0,0.5);
        }

        .detail-panel .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #8892b0;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .detail-panel h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .detail-panel .category-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-bottom: 20px;
        }

        .detail-panel h3 {
            font-size: 0.85rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px;
        }

        .detail-panel ul {
            list-style: none;
            padding: 0;
        }

        .detail-panel ul li {
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            border-left: 3px solid var(--node-color);
        }

        .data-flow-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-flow-item .arrow {
            color: #4ecdc4;
            font-size: 0.8rem;
        }

        /* Animated particles on SVG paths */
        @keyframes flowParticle {
            0% { offset-distance: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { offset-distance: 100%; opacity: 0; }
        }

        .flow-line {
            stroke: rgba(108, 99, 255, 0.3);
            stroke-width: 2;
            fill: none;
            transition: all 0.4s ease;
        }

        .flow-line.active {
            stroke: rgba(108, 99, 255, 0.8);
            stroke-width: 3;
            filter: drop-shadow(0 0 6px rgba(108, 99, 255, 0.5));
        }

        .flow-line.dimmed {
            stroke: rgba(108, 99, 255, 0.05);
        }

        /* Particle dots */
        .particle {
            r: 4;
            fill: #6c63ff;
            filter: drop-shadow(0 0 4px #6c63ff);
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #8892b0;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #ccd6f6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 999;
            max-width: 200px;
        }

        .tooltip.visible {
            opacity: 1;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4ecdc4, #6c63ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #8892b0;
            margin-top: 4px;
        }

        @media (max-width: 1000px) {
            .nodes-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            .nodes-grid {
                grid-template-columns: 1fr;
            }
            .detail-panel { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Slack Martech Data Flow</h1>
        <p>Interactive visualization of campaign orchestration data pipelines</p>
    </header>

    <div class="controls">
        <button class="active" data-filter="all">All Systems</button>
        <button data-filter="source">Data Sources</button>
        <button data-filter="orchestration">Orchestration</button>
        <button data-filter="channel">Channels</button>
        <button data-filter="analytics">Analytics</button>
        <button id="animate-btn">Animate Flow</button>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4ecdc4"></div>Data Sources</div>
        <div class="legend-item"><div class="legend-dot" style="background:#6c63ff"></div>Orchestration</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div>Channels</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ffd93d"></div>Analytics</div>
    </div>

    <div class="canvas-container">
        <svg class="connections" id="svg-connections"></svg>
        <div class="nodes-grid" id="nodes-grid"></div>
    </div>

    <div class="stats-bar">
        <div class="stat">
            <div class="stat-value">12</div>
            <div class="stat-label">Connected Systems</div>
        </div>
        <div class="stat">
            <div class="stat-value">24</div>
            <div class="stat-label">Data Flows</div>
        </div>
        <div class="stat">
            <div class="stat-value">6</div>
            <div class="stat-label">Campaign Types</div>
        </div>
        <div class="stat">
            <div class="stat-value">100%</div>
            <div class="stat-label">Human Approval</div>
        </div>
    </div>

    <div class="detail-panel" id="detail-panel">
        <button class="close-btn" id="close-panel">&times;</button>
        <div id="panel-content"></div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        const nodes = [
            {
                id: 'campaign-brief',
                title: 'Campaign Brief',
                icon: '📋',
                desc: 'Structured intake form for campaign requests',
                category: 'source',
                badge: 'Input',
                details: {
                    dataIn: ['Marketing team input', 'Business objectives', 'Target segments'],
                    dataOut: ['Parsed brief JSON', 'Campaign parameters', 'Timeline requirements'],
                    integrations: ['Slack form submission', 'Web intake UI']
                }
            },
            {
                id: 'data-cloud',
                title: 'Data Cloud',
                icon: '☁️',
                desc: 'Unified customer profiles & segments',
                category: 'source',
                badge: 'CDP',
                details: {
                    dataIn: ['CRM records', 'Behavioral events', 'Third-party enrichment'],
                    dataOut: ['Audience segments', 'Profile attributes', 'Engagement scores'],
                    integrations: ['Salesforce CDP', 'Segment', 'mParticle']
                }
            },
            {
                id: 'salesforce',
                title: 'Salesforce CRM',
                icon: '💼',
                desc: 'Account & opportunity data',
                category: 'source',
                badge: 'CRM',
                details: {
                    dataIn: ['Sales team updates', 'Lead scoring', 'Pipeline data'],
                    dataOut: ['Account status', 'Contact preferences', 'Deal stage'],
                    integrations: ['Marketing Cloud', 'Pardot', 'Data Cloud']
                }
            },
            {
                id: 'calendar',
                title: 'Campaign Calendar',
                icon: '📅',
                desc: 'Scheduling & conflict detection',
                category: 'source',
                badge: 'Planning',
                details: {
                    dataIn: ['Approved campaigns', 'Blackout dates', 'Event schedules'],
                    dataOut: ['Available send windows', 'Conflict alerts', 'Cadence rules'],
                    integrations: ['Google Calendar', 'Internal planning tools']
                }
            },
            {
                id: 'orchestrator',
                title: 'Campaign Orchestrator',
                icon: '🧠',
                desc: 'AI-powered campaign planning & coordination',
                category: 'orchestration',
                badge: 'Core Engine',
                details: {
                    dataIn: ['Parsed briefs', 'Context bundles', 'Rules & playbooks'],
                    dataOut: ['Campaign plans', 'Draft assets', 'QA results'],
                    integrations: ['Claude API', 'Rules engine', 'All systems']
                }
            },
            {
                id: 'ai-engine',
                title: 'Claude AI',
                icon: '🤖',
                desc: 'Brief parsing, copy generation, AI QA',
                category: 'orchestration',
                badge: 'AI',
                details: {
                    dataIn: ['Structured prompts', 'Context bundles', 'Brand guidelines'],
                    dataOut: ['Generated copy', 'Campaign structure', 'Quality signals'],
                    integrations: ['Anthropic API', 'Prompt library']
                }
            },
            {
                id: 'rules-engine',
                title: 'Rules Engine',
                icon: '⚙️',
                desc: 'Deterministic QA, naming, suppression',
                category: 'orchestration',
                badge: 'Validation',
                details: {
                    dataIn: ['Campaign drafts', 'Audience selections', 'Naming proposals'],
                    dataOut: ['Pass/fail results', 'Violation details', 'Fix suggestions'],
                    integrations: ['QA rules', 'Suppression lists', 'Naming conventions']
                }
            },
            {
                id: 'review-ui',
                title: 'Review & Approval',
                icon: '✅',
                desc: 'Human-in-the-loop approval workflow',
                category: 'orchestration',
                badge: 'HITL',
                details: {
                    dataIn: ['Campaign plans', 'QA results', 'Draft previews'],
                    dataOut: ['Approval status', 'Revision requests', 'Final sign-off'],
                    integrations: ['Web UI', 'Slack notifications', 'Email alerts']
                }
            },
            {
                id: 'email',
                title: 'Email Platform',
                icon: '📧',
                desc: 'Email delivery & personalization',
                category: 'channel',
                badge: 'Delivery',
                details: {
                    dataIn: ['Approved templates', 'Audience lists', 'Send schedules'],
                    dataOut: ['Delivery metrics', 'Bounce data', 'Engagement events'],
                    integrations: ['SFMC', 'Braze', 'Iterable', 'Marketo']
                }
            },
            {
                id: 'slack-channel',
                title: 'Slack Notifications',
                icon: '💬',
                desc: 'Team alerts, summaries & status updates',
                category: 'channel',
                badge: 'Comms',
                details: {
                    dataIn: ['Campaign status', 'QA alerts', 'Approval requests'],
                    dataOut: ['Team acknowledgments', 'Quick approvals', 'Feedback'],
                    integrations: ['Slack API', 'Bot framework', 'Workflows']
                }
            },
            {
                id: 'analytics',
                title: 'Campaign Analytics',
                icon: '📊',
                desc: 'Performance tracking & insights',
                category: 'analytics',
                badge: 'Reporting',
                details: {
                    dataIn: ['Send metrics', 'Engagement data', 'Conversion events'],
                    dataOut: ['Performance dashboards', 'ROI reports', 'Recommendations'],
                    integrations: ['Tableau', 'Looker', 'Internal dashboards']
                }
            },
            {
                id: 'feedback-loop',
                title: 'Feedback Loop',
                icon: '🔄',
                desc: 'Learning & optimization signals',
                category: 'analytics',
                badge: 'Optimization',
                details: {
                    dataIn: ['Campaign results', 'A/B test outcomes', 'User feedback'],
                    dataOut: ['Updated playbooks', 'Refined rules', 'Model improvements'],
                    integrations: ['Orchestrator', 'Rules engine', 'AI prompts']
                }
            }
        ];

        const connections = [
            { from: 'campaign-brief', to: 'orchestrator', label: 'Brief submission' },
            { from: 'data-cloud', to: 'orchestrator', label: 'Audience data' },
            { from: 'salesforce', to: 'data-cloud', label: 'CRM sync' },
            { from: 'salesforce', to: 'orchestrator', label: 'Account context' },
            { from: 'calendar', to: 'orchestrator', label: 'Schedule context' },
            { from: 'orchestrator', to: 'ai-engine', label: 'Prompts & context' },
            { from: 'ai-engine', to: 'orchestrator', label: 'Generated content' },
            { from: 'orchestrator', to: 'rules-engine', label: 'Draft for validation' },
            { from: 'rules-engine', to: 'orchestrator', label: 'QA results' },
            { from: 'orchestrator', to: 'review-ui', label: 'Review package' },
            { from: 'review-ui', to: 'orchestrator', label: 'Approval/revision' },
            { from: 'review-ui', to: 'email', label: 'Approved campaign' },
            { from: 'review-ui', to: 'slack-channel', label: 'Status notifications' },
            { from: 'orchestrator', to: 'slack-channel', label: 'Alerts & summaries' },
            { from: 'email', to: 'analytics', label: 'Delivery metrics' },
            { from: 'slack-channel', to: 'analytics', label: 'Engagement data' },
            { from: 'analytics', to: 'feedback-loop', label: 'Performance data' },
            { from: 'feedback-loop', to: 'orchestrator', label: 'Optimization signals' },
            { from: 'feedback-loop', to: 'rules-engine', label: 'Rule updates' },
            { from: 'data-cloud', to: 'email', label: 'Segment sync' },
            { from: 'calendar', to: 'rules-engine', label: 'Blackout dates' },
            { from: 'campaign-brief', to: 'slack-channel', label: 'Intake notification' },
            { from: 'email', to: 'feedback-loop', label: 'Campaign results' },
            { from: 'analytics', to: 'slack-channel', label: 'Performance alerts' }
        ];

        // Render nodes
        const grid = document.getElementById('nodes-grid');
        nodes.forEach(node => {
            const el = document.createElement('div');
            el.className = 'node';
            el.dataset.id = node.id;
            el.dataset.category = node.category;
            el.style.setProperty('--node-color', getCategoryColor(node.category));
            el.innerHTML = `
                <span class="node-icon">${node.icon}</span>
                <div class="node-title">${node.title}</div>
                <div class="node-desc">${node.desc}</div>
                <span class="node-badge">${node.badge}</span>
            `;
            el.addEventListener('click', () => showDetail(node));
            el.addEventListener('mouseenter', (e) => highlightConnections(node.id, e));
            el.addEventListener('mouseleave', () => clearHighlights());
            grid.appendChild(el);
        });

        function getCategoryColor(cat) {
            const colors = { source: '#4ecdc4', orchestration: '#6c63ff', channel: '#ff6b6b', analytics: '#ffd93d' };
            return colors[cat] || '#6c63ff';
        }

        // Draw connections
        function drawConnections() {
            const svg = document.getElementById('svg-connections');
            const container = document.querySelector('.canvas-container');
            const rect = container.getBoundingClientRect();
            svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
            svg.innerHTML = '';

            connections.forEach((conn, i) => {
                const fromEl = document.querySelector(`[data-id="${conn.from}"]`);
                const toEl = document.querySelector(`[data-id="${conn.to}"]`);
                if (!fromEl || !toEl) return;

                const fromRect = fromEl.getBoundingClientRect();
                const toRect = toEl.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                const x1 = fromRect.left + fromRect.width / 2 - containerRect.left;
                const y1 = fromRect.top + fromRect.height / 2 - containerRect.top;
                const x2 = toRect.left + toRect.width / 2 - containerRect.left;
                const y2 = toRect.top + toRect.height / 2 - containerRect.top;

                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;
                const cx = midX + (y2 - y1) * 0.1;
                const cy = midY - (x2 - x1) * 0.1;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const d = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
                path.setAttribute('d', d);
                path.setAttribute('class', 'flow-line');
                path.dataset.from = conn.from;
                path.dataset.to = conn.to;
                path.dataset.label = conn.label;
                path.id = `path-${i}`;
                svg.appendChild(path);
            });
        }

        // Highlight connections on hover
        function highlightConnections(nodeId, event) {
            const allNodes = document.querySelectorAll('.node');
            const allLines = document.querySelectorAll('.flow-line');
            const connectedIds = new Set([nodeId]);

            connections.forEach(c => {
                if (c.from === nodeId) connectedIds.add(c.to);
                if (c.to === nodeId) connectedIds.add(c.from);
            });

            allNodes.forEach(n => {
                if (connectedIds.has(n.dataset.id)) {
                    n.classList.add('highlighted');
                    n.classList.remove('dimmed');
                } else {
                    n.classList.add('dimmed');
                    n.classList.remove('highlighted');
                }
            });

            allLines.forEach(line => {
                if (line.dataset.from === nodeId || line.dataset.to === nodeId) {
                    line.classList.add('active');
                    line.classList.remove('dimmed');
                } else {
                    line.classList.add('dimmed');
                    line.classList.remove('active');
                }
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.node').forEach(n => {
                n.classList.remove('highlighted', 'dimmed');
            });
            document.querySelectorAll('.flow-line').forEach(l => {
                l.classList.remove('active', 'dimmed');
            });
        }

        // Detail panel
        function showDetail(node) {
            const panel = document.getElementById('detail-panel');
            const content = document.getElementById('panel-content');
            const color = getCategoryColor(node.category);

            content.innerHTML = `
                <div style="font-size:3rem; margin-bottom:16px;">${node.icon}</div>
                <h2>${node.title}</h2>
                <span class="category-tag" style="background:${color}22; color:${color}; border:1px solid ${color}44;">${node.category}</span>
                <p style="color:#8892b0; margin-top:12px;">${node.desc}</p>

                <h3>Data Inputs</h3>
                <ul>${node.details.dataIn.map(d => `<li><div class="data-flow-item"><span class="arrow">&#8594;</span> ${d}</div></li>`).join('')}</ul>

                <h3>Data Outputs</h3>
                <ul>${node.details.dataOut.map(d => `<li><div class="data-flow-item"><span class="arrow">&#8592;</span> ${d}</div></li>`).join('')}</ul>

                <h3>Integrations</h3>
                <ul>${node.details.integrations.map(d => `<li>${d}</li>`).join('')}</ul>

                <h3>Connected Flows</h3>
                <ul>
                    ${connections.filter(c => c.from === node.id || c.to === node.id).map(c => {
                        const direction = c.from === node.id ? '&#8594;' : '&#8592;';
                        const other = c.from === node.id ? c.to : c.from;
                        const otherNode = nodes.find(n => n.id === other);
                        return `<li><div class="data-flow-item"><span class="arrow">${direction}</span> ${otherNode ? otherNode.title : other}: ${c.label}</div></li>`;
                    }).join('')}
                </ul>
            `;
            content.style.setProperty('--node-color', color);
            panel.classList.add('open');
        }

        document.getElementById('close-panel').addEventListener('click', () => {
            document.getElementById('detail-panel').classList.remove('open');
        });

        // Filter buttons
        document.querySelectorAll('.controls button[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                document.querySelectorAll('.node').forEach(node => {
                    if (filter === 'all' || node.dataset.category === filter) {
                        node.style.display = '';
                    } else {
                        node.style.display = 'none';
                    }
                });
                setTimeout(drawConnections, 50);
            });
        });

        // Animate flow
        let animating = false;
        document.getElementById('animate-btn').addEventListener('click', function() {
            animating = !animating;
            this.classList.toggle('active', animating);
            if (animating) startAnimation();
            else stopAnimation();
        });

        let animationFrames = [];
        function startAnimation() {
            const svg = document.getElementById('svg-connections');
            const paths = svg.querySelectorAll('.flow-line');

            paths.forEach((path, i) => {
                const particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                particle.setAttribute('r', '4');
                particle.setAttribute('fill', '#6c63ff');
                particle.setAttribute('filter', 'url(#glow)');
                particle.classList.add('particle');
                svg.appendChild(particle);

                const length = path.getTotalLength();
                let progress = Math.random();
                const speed = 0.002 + Math.random() * 0.002;

                function animate() {
                    progress += speed;
                    if (progress > 1) progress = 0;
                    const point = path.getPointAtLength(progress * length);
                    particle.setAttribute('cx', point.x);
                    particle.setAttribute('cy', point.y);
                    particle.style.opacity = Math.sin(progress * Math.PI);
                    if (animating) {
                        animationFrames.push(requestAnimationFrame(animate));
                    } else {
                        particle.remove();
                    }
                }
                animationFrames.push(requestAnimationFrame(animate));
            });

            // Add SVG filter for glow
            if (!document.getElementById('glow-filter')) {
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                defs.id = 'glow-filter';
                defs.innerHTML = `
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                `;
                svg.prepend(defs);
            }
        }

        function stopAnimation() {
            animationFrames.forEach(id => cancelAnimationFrame(id));
            animationFrames = [];
            document.querySelectorAll('.particle').forEach(p => p.remove());
        }

        // Init
        window.addEventListener('load', () => {
            setTimeout(drawConnections, 100);
        });
        window.addEventListener('resize', drawConnections);

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('detail-panel').classList.remove('open');
            }
        });
    </script>
</body>
</html>
